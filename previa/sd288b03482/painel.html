<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#141110">
<title>Painel · Stela Cristina</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f0d0c;--card:#1a1613;--card2:#221d19;--line:rgba(201,164,106,.22);--gold:#C9A46A;--gold2:#E7CC97;--txt:#F4ECE2;--soft:#a89a84;--s:#E7CC97;--l:#8fd1c0}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--txt);font:400 15px/1.45 Jost,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
.app{max-width:560px;margin:0 auto;min-height:100vh;padding:calc(18px + env(safe-area-inset-top)) 16px calc(110px + env(safe-area-inset-bottom))}
header{display:flex;align-items:center;gap:12px;margin-bottom:20px}
header img{height:38px}
header h1{font:500 26px/1 "Cormorant Garamond",serif}
header small{display:block;font:500 10.5px Jost;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);margin-top:4px}
header .rf{margin-left:auto;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:none;cursor:pointer;font-size:17px}
h2{font:500 30px/1.1 "Cormorant Garamond",serif;margin:6px 0 14px}
h2 em{color:var(--gold2)}
.days{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -16px 16px;padding:0 16px}
.days::-webkit-scrollbar{display:none}
.day{flex:none;width:58px;padding:9px 0;border-radius:16px;border:1px solid var(--line);background:var(--card);text-align:center;cursor:pointer}
.day small{display:block;font-size:11px;color:var(--soft);text-transform:uppercase;letter-spacing:.08em}
.day b{display:block;font:500 22px/1.1 "Cormorant Garamond",serif}
.day .dot{display:block;width:5px;height:5px;border-radius:50%;background:var(--gold);margin:4px auto 0;opacity:0}
.day.has .dot{opacity:1}
.day.sel{background:linear-gradient(140deg,#b08848,#ecd29d);color:#1a1208;border-color:transparent}
.day.sel small{color:#3a2a14}.day.sel .dot{background:#1a1208}
.legend{display:flex;gap:14px;font-size:12.5px;color:var(--soft);margin-bottom:12px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:0}
.appt{display:flex;gap:14px;align-items:stretch;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px 16px;margin-bottom:10px;cursor:pointer}
.appt .hr{font:500 22px/1 "Cormorant Garamond",serif;min-width:54px;padding-top:2px}
.appt .bar{width:3px;border-radius:3px;background:var(--s)}
.appt.l .bar{background:var(--l)}
.appt b{display:block;font-weight:500}
.appt span{display:block;font-size:13px;color:var(--soft)}
.appt .tag{margin-left:auto;align-self:center;font-size:11px;letter-spacing:.06em;color:var(--soft);border:1px solid var(--line);border-radius:99px;padding:4px 9px;white-space:nowrap}
.empty{color:var(--soft);text-align:center;padding:34px 10px;border:1px dashed var(--line);border-radius:20px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:22px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px}
.stat b{display:block;font:500 28px/1 "Cormorant Garamond",serif;color:var(--gold2)}
.stat span{font-size:12px;color:var(--soft)}
label{display:block;font:500 11px Jost;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);margin:16px 0 7px}
input,select{width:100%;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 14px;outline:none}
input:focus,select:focus{border-color:var(--gold)}
select option{background:#1a1613}
.slots{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.slot{padding:10px 0;border-radius:12px;border:1px solid var(--line);background:var(--card);cursor:pointer;text-align:center}
.slot.sel{background:var(--gold2);color:#1a1208;border-color:transparent;font-weight:600}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.go{width:100%;margin-top:22px;padding:16px;border:0;border-radius:99px;background:linear-gradient(100deg,#b08848,#ecd29d,#b08848);color:#1a1208;font-weight:600;cursor:pointer}
.go:disabled{opacity:.45}
.msg{margin-top:12px;text-align:center;font-size:14px}
.msg.ok{color:#9be3b1}.msg.err{color:#ffb4a8}
.search{margin-bottom:14px}
.cli{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px 14px;margin-bottom:8px;cursor:pointer}
.av{flex:none;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--card2);border:1px solid var(--line);font:500 19px "Cormorant Garamond",serif;color:var(--gold2)}
.cli b{display:block;font-weight:500}.cli span{font-size:12.5px;color:var(--soft)}
.st{margin-left:auto;font-size:11px;border-radius:99px;padding:4px 10px;border:1px solid}
.st.Ativa{color:#9be3b1;border-color:rgba(155,227,177,.4)}.st.Nova{color:var(--gold2);border-color:var(--line)}.st.Inativa{color:#ffb4a8;border-color:rgba(255,180,168,.4)}
/* ficha */
.sheet{position:fixed;inset:0;z-index:50;background:rgba(5,4,3,.7);display:none;align-items:flex-end;justify-content:center}
.sheet.on{display:flex}
.sheet .box{width:100%;max-width:560px;max-height:90vh;overflow:auto;background:#141110;border:1px solid var(--line);border-bottom:0;border-radius:26px 26px 0 0;padding:20px 18px calc(24px + env(safe-area-inset-bottom))}
.sheet .x{float:right;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:none;cursor:pointer}
.fh{display:flex;gap:14px;align-items:center;margin:4px 0 16px}
.fh .av{width:56px;height:56px;font-size:24px}
.fh h3{font:500 28px/1 "Cormorant Garamond",serif}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.kv div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.kv small{display:block;font-size:11px;color:var(--soft);letter-spacing:.08em;text-transform:uppercase}
.acts{display:flex;gap:10px;margin-bottom:16px}
.acts a{flex:1;text-align:center;padding:12px;border-radius:99px;text-decoration:none;font-weight:600;font-size:14px}
.acts .wa{background:#25D366;color:#06210f}.acts .tel{border:1px solid var(--line);color:var(--txt)}
.hist{border-top:1px solid var(--line)}
.hist div{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.hist span{color:var(--soft)}
.hist .fut{color:var(--gold2)}
/* barra */
nav.tb{position:fixed;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom));max-width:540px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);align-items:end;padding:8px 6px 7px;border-radius:22px;background:rgba(18,15,13,.96);border:1px solid var(--line);z-index:40}
nav.tb button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--soft);font:500 11px Jost;cursor:pointer}
nav.tb svg{width:22px;height:22px}
nav.tb .on{color:var(--gold2)}
nav.tb .mid{margin-top:-22px;color:var(--gold2)}
nav.tb .mid svg{width:54px;height:54px;padding:14px;border-radius:50%;background:linear-gradient(140deg,#b08848,#ecd29d);color:#1a1208}
/* pin */
.pin{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px}
.pin img{height:70px;margin-bottom:18px}
.pin input{max-width:220px;text-align:center;font-size:24px;letter-spacing:.4em;margin:18px 0 0}
.pin p{color:var(--soft);font-size:14px}
.test{font-size:12px;color:var(--soft);text-align:center;margin-top:18px}
.load{text-align:center;color:var(--soft);padding:30px}
</style>
</head>

var R=document.getElementById('root'),pin='',data=[],busy={},tab='ag',selDay=null,nf={svc:0,who:'x',day:null,slot:null};
try{pin=localStorage.getItem(KEY)||''}catch(e){}
function ds(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function hm(m){return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0')}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function days(n){var r=[],d=new Date();d.setHours(12,0,0,0);for(var i=0;i<n;i++){var x=new Date(d);x.setDate(d.getDate()+i);r.push(x)}return r}
function today(){return ds(new Date())}
function load(cb){R.innerHTML='<div class="load">A carregar…</div>';var t=days(1)[0];
 Promise.all([fetch(API+'?painel=1&pin='+encodeURIComponent(pin)).then(function(r){return r.json()}),fetch(API+'?from='+ds(t)+'&days=21').then(function(r){return r.json()})]).then(function(a){
  if(!a[0].ok){try{localStorage.removeItem(KEY)}catch(e){}pin='';return pinScreen('Código errado. Tente de novo.')}
  data=a[0].m;busy=a[1].busy||{};cb()}).catch(function(){R.innerHTML='<div class="load">Sem ligação. Tente de novo.</div>'})}
function pinScreen(err){R.innerHTML='<div class="pin"><img src="'+MONO+'" alt=""><h2>Painel da <em>Stela</em></h2><p>Introduza o código de acesso</p><input id="pi" inputmode="numeric" maxlength="6" autocomplete="off">'+(err?'<p class="msg err">'+err+'</p>':'')+'<p class="test">Versão de teste</p></div>';
 var i=document.getElementById('pi');i.focus();i.oninput=function(){if(i.value.length===6){pin=i.value;try{localStorage.setItem(KEY,pin)}catch(e){}load(render)}}}
function head(){return '<header><img src="'+MONO+'" alt=""><div><h1>Stela Cristina</h1><small>Painel · teste</small></div><button class="rf" id="rf" aria-label="Atualizar">↻</button></header>'}
function bar(){var ic={ag:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/></svg>',nv:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 5v14M5 12h14"/></svg>',cl:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c1.2-3.5 3.6-5.5 6.5-5.5s5.3 2 6.5 5.5"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7M18.5 14.8c1.6.8 2.6 2.6 3 5.2"/></svg>'};
 return '<nav class="tb"><button data-t="ag" class="'+(tab=='ag'?'on':'')+'">'+ic.ag+'<span>Agenda</span></button><button data-t="nv" class="mid">'+ic.nv+'<span>Marcar</span></button><button data-t="cl" class="'+(tab=='cl'?'on':'')+'">'+ic.cl+'<span>Clientes</span></button></nav>'}
function render(){var h=head()+(tab=='ag'?agenda():tab=='nv'?nova():clientes())+bar();R.innerHTML='<div class="app">'+h+'</div>';
 document.getElementById('rf').onclick=function(){load(render)};
 R.querySelectorAll('nav.tb button').forEach(function(b){b.onclick=function(){tab=b.dataset.t;if(tab=='nv'){nf.slot=null}render();scrollTo(0,0)}});
 if(tab=='ag')bindAg();if(tab=='nv')bindNv();if(tab=='cl')bindCl()}
/* AGENDA */
function agenda(){if(!selDay)selDay=today();var ds_=days(14),l=data.filter(function(x){return x.d===selDay}).sort(function(a,b){return a.h<b.h?-1:1});
 var t=today(),hoje=data.filter(function(x){return x.d===t}).length,sem=data.filter(function(x){var d=new Date(x.d+'T12:00');var n=new Date();var diff=(d-n)/864e5;return diff>=-1&&diff<7}).length;
 var fut=data.filter(function(x){return x.d>=t}).length;
 var d0=new Date(selDay+'T12:00');
 return '<div class="stats"><div class="stat"><b>'+hoje+'</b><span>hoje</span></div><div class="stat"><b>'+sem+'</b><span>esta semana</span></div><div class="stat"><b>'+fut+'</b><span>marcadas</span></div></div>'+
 '<div class="days">'+ds_.map(function(d){var k=ds(d),has=data.some(function(x){return x.d===k});return '<button class="day'+(k===selDay?' sel':'')+(has?' has':'')+'" data-d="'+k+'"><small>'+DOW[d.getDay()]+'</small><b>'+d.getDate()+'</b><i class="dot"></i></button>'}).join('')+'</div>'+
 '<h2>'+(selDay===t?'Hoje, ':'')+'<em>'+DOW[d0.getDay()]+', '+d0.getDate()+' de '+MON[d0.getMonth()]+'</em></h2>'+
 '<div class="legend"><span><i style="background:var(--s)"></i>Stela</span><span><i style="background:var(--l)"></i>Lurdes</span></div>'+
 (l.length?l.map(function(x,i){return '<div class="appt '+(x.p==='Lurdes'?'l':'')+'" data-c="'+esc(x.c)+'"><div class="hr">'+esc(x.h)+'</div><i class="bar"></i><div><b>'+esc(x.c)+'</b><span>'+esc(x.s)+' · '+esc(x.p)+'</span></div><span class="tag">'+esc(x.via||'')+'</span></div>'}).join(''):'<div class="empty">Sem marcações neste dia.</div>')}
function bindAg(){R.querySelectorAll('.day').forEach(function(b){b.onclick=function(){selDay=b.dataset.d;render()}});R.querySelectorAll('.appt').forEach(function(a){a.onclick=function(){ficha(a.dataset.c)}})}
/* NOVA */
function slots(){var s=SV[nf.svc],dur=s[2],who=nf.who==='x'?s[3].split(''):[nf.who],b=busy[ds(nf.day)]||[],out=[],now=new Date();
 if(nf.who!=='x'&&s[3].indexOf(nf.who)<0)return[];
 for(var t=600;t+dur<=1140;t+=30){if(ds(nf.day)===today()&&t<=now.getHours()*60+now.getMinutes())continue;
  if(who.some(function(w){return b.every(function(x){return x.st!==w||t+dur<=x.a||t>=x.b})}))out.push(t)}return out}
function nova(){if(!nf.day){var L=days(14).filter(function(d){return d.getDay()!==0});nf.day=L.find(function(d){nf.day=d;return slots().length})||L[0]}var sl=slots();
 return '<h2>Nova <em>marcação</em></h2>'+
 '<label>Cliente</label><input id="fn" placeholder="Nome" value="'+esc(nf.n||'')+'" list="cls"><datalist id="cls">'+clients().map(function(c){return '<option value="'+esc(c.c)+'">'}).join('')+'</datalist>'+
 '<div class="row2"><div><label>Telemóvel</label><input id="fp" inputmode="tel" placeholder="9xx xxx xxx" value="'+esc(nf.p||'')+'"></div><div><label>Como conheceu</label><select id="fo"><option></option><option>Instagram</option><option>Google</option><option>Indicação</option><option>Facebook</option><option>Passou na porta</option><option>Outro</option></select></div></div>'+
 '<label>Tratamento</label><select id="fs">'+SV.map(function(s,i){return '<option value="'+i+'"'+(i==nf.svc?' selected':'')+'>'+s[0]+' · '+s[1]+'</option>'}).join('')+'</select>'+
 '<label>Profissional</label><select id="fw"><option value="x">Quem estiver livre</option><option value="s"'+(nf.who=='s'?' selected':'')+'>Stela</option><option value="l"'+(nf.who=='l'?' selected':'')+'>Lurdes</option></select>'+
 '<label>Dia</label><div class="days">'+days(14).map(function(d,i){var closed=d.getDay()===0;return '<button class="day'+(ds(d)===ds(nf.day)?' sel':'')+'" data-i="'+i+'"'+(closed?' disabled style="opacity:.3"':'')+'><small>'+DOW[d.getDay()]+'</small><b>'+d.getDate()+'</b><i class="dot"></i></button>'}).join('')+'</div>'+
 '<label>Hora</label>'+(sl.length?'<div class="slots">'+sl.map(function(t){return '<button class="slot'+(nf.slot===t?' sel':'')+'" data-t="'+t+'">'+hm(t)+'</button>'}).join('')+'</div>':'<div class="empty">Sem horários livres neste dia.</div>')+
 '<button class="go" id="go"'+(nf.slot==null?' disabled':'')+'>Marcar</button><div class="msg" id="msg"></div>'}
function keep(){var g=function(i){var e=document.getElementById(i);return e?e.value:''};nf.n=g('fn');nf.p=g('fp');nf.o=g('fo')}
function bindNv(){var fn=document.getElementById('fn');fn.onchange=function(){var c=clients().find(function(x){return x.c===fn.value});if(c){document.getElementById('fp').value=c.t}};
 document.getElementById('fs').onchange=function(e){keep();nf.svc=+e.target.value;nf.slot=null;render()};
 document.getElementById('fw').onchange=function(e){keep();nf.who=e.target.value;nf.slot=null;render()};
 if(nf.o)document.getElementById('fo').value=nf.o;
 R.querySelectorAll('.days .day').forEach(function(b){b.onclick=function(){keep();nf.day=days(14)[+b.dataset.i];nf.slot=null;render()}});
 R.querySelectorAll('.slot').forEach(function(b){b.onclick=function(){keep();nf.slot=+b.dataset.t;render()}});
 document.getElementById('go').onclick=function(){keep();var m=document.getElementById('msg'),go=this,s=SV[nf.svc];
  if(!nf.n||String(nf.p).replace(/\D/g,'').length<9){m.className='msg err';m.textContent='Preencha o nome e o telemóvel.';return}
  go.disabled=true;go.textContent='A marcar…';
  fetch(API,{method:'POST',body:JSON.stringify({svc:s[0],price:s[1],dur:s[2],date:ds(nf.day),start:nf.slot,who:nf.who==='x'?s[3].split(''):[nf.who],name:nf.n,phone:nf.p,origem:nf.o||'',via:'Telefone'})}).then(function(r){return r.json()}).then(function(j){
   if(j.ok){var when=DOW[nf.day.getDay()]+', '+nf.day.getDate()+' '+MON[nf.day.getMonth()]+' às '+hm(nf.slot),who=j.who==='s'?'Stela':'Lurdes',nome=nf.n,tel=nf.p;nf={svc:0,who:'x',day:null,slot:null};
    load(function(){tab='nv';render();var mm=document.getElementById('msg');mm.className='msg ok';mm.innerHTML='✓ Marcado: '+esc(nome)+' · '+when+' com a '+who+'<br><a style="color:#9be3b1" target="_blank" href="https://wa.me/351'+String(tel).replace(/\D/g,'').slice(-9)+'?text='+encodeURIComponent('Olá, '+nome.split(' ')[0]+'! A sua marcação ficou para '+when+'. Até breve! Stela Cristina')+'">Enviar confirmação à cliente pelo WhatsApp →</a>'})}
   else{go.disabled=false;go.textContent='Marcar';m.className='msg err';m.textContent=j.err==='ocupado'?'Esse horário acabou de ficar ocupado.':'Não foi possível marcar. Verifique os dados.'}
  }).catch(function(){go.disabled=false;go.textContent='Marcar';m.className='msg err';m.textContent='Sem ligação. Tente de novo.'})}}
/* CLIENTES */
function clients(){var map={},t=today();data.forEach(function(x){var k=String(x.c).trim().toLowerCase();var c=map[k]||(map[k]={c:x.c,t:x.t,e:x.e,o:x.o,v:[],f:[]});(x.d<t?c.v:c.f).push(x);if(x.o&&!c.o)c.o=x.o});
 return Object.keys(map).map(function(k){var c=map[k];c.v.sort(function(a,b){return a.d<b.d?1:-1});c.f.sort(function(a,b){return a.d<b.d?-1:1});
  var last=c.v[0],days_=last?(new Date()-new Date(last.d+'T12:00'))/864e5:0;c.st=c.v.length<=1&&!last?'Nova':(c.v.length<=1?'Nova':(days_>90&&!c.f.length?'Inativa':'Ativa'));return c}).sort(function(a,b){return a.c.localeCompare(b.c)})}
function clientes(){var cs=clients();return '<h2><em>'+cs.length+'</em> clientes</h2><input class="search" id="q" placeholder="Procurar por nome ou telemóvel">'+
 '<div id="cl">'+cs.map(cliRow).join('')+'</div>'}
function cliRow(c){var last=c.v[0];return '<div class="cli" data-c="'+esc(c.c)+'"><div class="av">'+esc(String(c.c).trim()[0]||'?')+'</div><div><b>'+esc(c.c)+'</b><span>'+c.v.length+' visita'+(c.v.length==1?'':'s')+(last?' · última '+fmt(last.d):'')+'</span></div><span class="st '+c.st+'">'+c.st+'</span></div>'}
function fmt(d){var x=new Date(d+'T12:00');return x.getDate()+' '+MON[x.getMonth()]}
function bindCl(){var q=document.getElementById('q');q.oninput=function(){var v=q.value.toLowerCase().replace(/\s/g,'');document.getElementById('cl').innerHTML=clients().filter(function(c){return (c.c+c.t).toLowerCase().replace(/\s/g,'').indexOf(v)>=0}).map(cliRow).join('');bindRows()};bindRows()}
function bindRows(){R.querySelectorAll('.cli').forEach(function(a){a.onclick=function(){ficha(a.dataset.c)}})}
function ficha(name){var c=clients().find(function(x){return x.c===name});if(!c)return;var n=String(c.t).replace(/\D/g,'').slice(-9),last=c.v[0],first=c.v[c.v.length-1];
 var S=document.getElementById('sheet'),B=document.getElementById('sbox');
 B.innerHTML='<button class="x" aria-label="Fechar">✕</button><div class="fh"><div class="av">'+esc(String(c.c).trim()[0])+'</div><div><h3>'+esc(c.c)+'</h3><span class="st '+c.st+'">'+c.st+'</span></div></div>'+
 '<div class="acts"><a class="wa" target="_blank" href="https://wa.me/351'+n+'">WhatsApp</a><a class="tel" href="tel:+351'+n+'">Ligar</a></div>'+
 '<div class="kv"><div><small>Telemóvel</small>'+esc(c.t)+'</div><div><small>Visitas</small>'+c.v.length+'</div><div><small>1.ª visita</small>'+(first?fmt(first.d):'—')+'</div><div><small>Última</small>'+(last?fmt(last.d):'—')+'</div><div><small>Conheceu por</small>'+esc(c.o||'—')+'</div><div><small>Próxima</small>'+(c.f[0]?fmt(c.f[0].d)+' '+esc(c.f[0].h):'—')+'</div></div>'+
 '<label>Histórico</label><div class="hist">'+c.f.map(function(x){return '<div class="fut"><b>'+fmt(x.d)+' · '+esc(x.h)+'</b><span>'+esc(x.s)+' · '+esc(x.p)+'</span></div>'}).join('')+c.v.map(function(x){return '<div><b>'+fmt(x.d)+'</b><span>'+esc(x.s)+' · '+esc(x.p)+'</span></div>'}).join('')+'</div>'+
 '<button class="go" id="again">Marcar de novo</button>';
 S.classList.add('on');S.onclick=function(e){if(e.target===S||e.target.closest('.x'))S.classList.remove('on')};
 document.getElementById('again').onclick=function(){S.classList.remove('on');tab='nv';nf={svc:0,who:'x',day:null,slot:null,n:c.c,p:c.t,o:c.o};render();scrollTo(0,0)}}
if(pin)load(render);else pinScreen();
})();
</script>
